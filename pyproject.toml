[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-readonly-mcp"
version = "1.0.0"
description = "Read-only MCP server that lets an AI assistant read a MetaTrader 5 account without being able to trade."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Herman Setiawan" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "metatrader5", "mt5", "claude", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.3,<3",
    # The MetaTrader5 package only exists for Windows. Tests use a fake module.
    "MetaTrader5>=5.0.6231; sys_platform == 'win32'",
]

[project.scripts]
mt5-readonly-mcp = "mt5_readonly_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_readonly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
